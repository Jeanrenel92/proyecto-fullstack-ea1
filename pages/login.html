<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Pastelería 1000 Sabores</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Iniciar sesión</h1>

            <p>Ingresa a tu cuenta de Pastelería 1000 Sabores</p>

            <form id="loginForm">

                <div class="campo">
                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        maxlength="100"
                        placeholder="ejemplo@gmail.com"
                    >

                    <span class="error" id="errorCorreo"></span>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        minlength="4"
                        maxlength="10"
                        placeholder="Ingresa tu contraseña"
                    >

                    <span class="error" id="errorContrasena"></span>
                </div>

                <span class="error mensaje-login" id="mensajeLogin"></span>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <div class="crear-cuenta">
                <span>¿No tienes una cuenta todavía?</span>
                <a href="registro.html">Crear cuenta</a>
            </div>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
