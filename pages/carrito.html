<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - 1000 Sabores</title>
    <!-- Bootstrap CSS (Crucial para que no se desordene) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS global -->
    <link rel="stylesheet" href="../css/style-global.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <!-- Contenedor Principal de la Página del Carrito -->
    <main class="container my-5" style="min-height: 50vh;">
        <h2 class="mb-4 fw-bold text-center text-md-start">Tu Carrito de Compras</h2>
        
        <div class="row">
            <!-- Columna Izquierda: Lista de Productos -->
            <div class="col-lg-8 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4" id="contenedor-carrito-pagina">
                        <!-- carrito.js inyectará los productos aquí -->
                    </div>
                </div>
            </div>
            
            <!-- Columna Derecha: Resumen de Compra -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold border-bottom pb-3 mb-3">Resumen de la orden</h5>
                        
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5">Total a pagar:</span>
                            <h4 class="text-danger fw-bold mb-0">$<span id="precio-total-pagina">0</span></h4>
                        </div>
                        
                        <button id="btn-pagar" class="btn btn-danger w-100 fw-bold py-3 fs-5">Proceder al pago</button>
                        <a href="../pages/catalogo.html" class="btn btn-outline-secondary w-100 mt-2">Seguir comprando</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer inyectado por JS -->
    <footer class="footer">
        <div id="footer"></div>
    </footer>

    <!-- Scripts en orden estricto -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/catalogo_admin.js"></script>
    <script src="../js/carrito.js"></script>
</body>
</html>
