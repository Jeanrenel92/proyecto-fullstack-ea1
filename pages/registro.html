<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Pastelería 1000 Sabores</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

   
    <div id="header"></div>

    <main class="registro-container">

        <section class="registro-card">

            <h1>Crear cuenta</h1>

            <p>Regístrate en Pastelería 1000 Sabores</p>

            <form id="registroForm">

                <div class="campo">
                    <label for="run">RUN</label>
                    <input
                        type="text"
                        id="run"
                        name="run"
                        minlength="7"
                        maxlength="9"
                        placeholder="Ej: 19011022K"
                    >
                    <span class="error" id="errorRun"></span>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        maxlength="10"
                        minlength="4"
                        placeholder="4 a 10 caracteres"
                    >
                    <span class="error" id="errorContrasena"></span>
                </div>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        maxlength="50"
                        placeholder="Ingresa tu nombre"
                    >
                    <span class="error" id="errorNombre"></span>
                </div>

                <div class="campo">
                    <label for="apellidos">Apellidos</label>
                    <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        maxlength="100"
                        placeholder="Ingresa tus apellidos"
                    >
                    <span class="error" id="errorApellidos"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        maxlength="100"
                        placeholder="ejemplo@gmail.com"
                    >
                    <span class="error" id="errorCorreo"></span>
                </div>

                <div class="campo">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input
                        type="date"
                        id="fechaNacimiento"
                        name="fechaNacimiento"
                    >
                    <span class="error" id="errorFecha"></span>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        maxlength="300"
                        placeholder="Ingresa tu dirección"
                    >
                    <span class="error" id="errorDireccion"></span>
                </div>

                <div class="campo">
                    <label for="region">Región</label>

                    <select id="region" name="region">
                        <option value="">Selecciona una región</option>
                    </select>

                    <span class="error" id="errorRegion"></span>
                </div>

                <div class="campo">
                    <label for="comuna">Comuna</label>

                    <select id="comuna" name="comuna">
                        <option value="">Selecciona una comuna</option>
                    </select>

                    <span class="error" id="errorComuna"></span>
                </div>

                <button type="submit">
                    Crear cuenta
                </button>

            </form>

        </section>

    </main>

   
    <div id="footer"></div>

    <script src="../js/components.js"></script>
    <script src="../js/registro.js"></script>

</body>
</html>
