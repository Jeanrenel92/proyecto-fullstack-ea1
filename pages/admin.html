<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | 1000 Sabores</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div id="header"></div>

    <main class="admin-contenido">

        <div id="admin-menu"></div>

        <section class="admin-dashboard">

            <div class="admin-encabezado">
                <span>ADMINISTRACIÓN</span>
                <h1>Panel de Administración</h1>
                <p>
                    Gestiona el contenido y los usuarios
                    de 1000 Sabores.
                </p>
            </div>

            <div class="admin-opciones">

                <a href="catalogo_admin.html" class="admin-card">
                    <span>🍰</span>
                    <h2>Catálogo</h2>
                    <p>
                        Gestiona los productos, precios,
                        categorías e imágenes.
                    </p>
                    <strong>
                        Administrar catálogo →
                    </strong>
                </a>

                <a href="usuario_admin.html" class="admin-card">
                    <span>👤</span>
                    <h2>Usuarios</h2>
                    <p>
                        Consulta y administra los
                        usuarios registrados.
                    </p>
                    <strong>
                        Administrar usuarios →
                    </strong>
                </a>

            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script src="../js/components.js"></script>

</body>
</html>
