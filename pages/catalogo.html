<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Catálogo | 1000 Sabores</title>

<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/catalogo.css">
```

</head>

<body>

```
<div id="header"></div>

<main>

    <section class="catalogo">
        <div class="contenedor">

            <div class="catalogo-encabezado">
                <span class="catalogo-etiqueta">NUESTROS PRODUCTOS</span>

                <h1>Catálogo de Productos</h1>

                <p>
                    Descubre nuestros productos de Pastelería 1000 Sabores.
                </p>
            </div>

            <div class="catalogo-filtros">

                <input
                    type="search"
                    id="buscarProducto"
                    placeholder="Buscar producto..."
                >

                <select id="filtrarCategoria">

                    <option value="">
                        Todas las categorías
                    </option>

                    <option value="Tortas Cuadradas">
                        Tortas Cuadradas
                    </option>

                    <option value="Tortas Circulares">
                        Tortas Circulares
                    </option>

                    <option value="Postres Individuales">
                        Postres Individuales
                    </option>

                    <option value="Productos Sin Azúcar">
                        Productos Sin Azúcar
                    </option>

                    <option value="Pastelería Tradicional">
                        Pastelería Tradicional
                    </option>

                    <option value="Productos Sin Gluten">
                        Productos Sin Gluten
                    </option>

                    <option value="Productos Vegana">
                        Productos Vegana
                    </option>

                    <option value="Tortas Especiales">
                        Tortas Especiales
                    </option>

                </select>

            </div>

            <div class="catalogo-listado">

                <div
                    class="productos-grid"
                    id="listaProductos">
                </div>

            </div>

        </div>
    </section>

</main>

<div id="footer"></div>

<script src="../js/components.js"></script>
<script src="../js/catalogo.js"></script>
```

</body>
</html>
